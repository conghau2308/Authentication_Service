spring.application.name=auth-service

spring.threads.virtual.enabled=true

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/authservice-db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=auth_service
spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.format_sql=true
# Thêm vào để giảm noise từ Hibernate
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# spring.datasource.url=jdbc:mysql://localhost:3306/AuthServiceDB
# spring.datasource.username=root
# spring.datasource.password=123456
# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Connection pool settings
spring.datasource.hikari.pool-name=FaceAuthHikariPool

spring.jpa.hibernate.ddl-auto=none

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=redis123
spring.data.redis.repositories.enabled=false

# Connection pool (Lettuce)
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Timeout
spring.data.redis.timeout=60000

logging.level.com.Authentication.AuthService=TRACE
logging.level.root=DEBUG

spring.config.import=optional:file:.env[.properties]

server.port=8080
server.url=${SERVER_URL:http://localhost:8080}
# Thymeleaf Configuration
# spring.thymeleaf.prefix=classpath:/templates/
# spring.thymeleaf.suffix=.html
# spring.thymeleaf.mode=HTML
# spring.thymeleaf.encoding=UTF-8
# spring.thymeleaf.cache=false
# spring.thymeleaf.enabled=true

# Tùy chỉnh đường dẫn Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Cấu hình package để scan
springdoc.packages-to-scan=com.Authentication.AuthService.controller
springdoc.paths-to-match=/**

# Bật/tắt Swagger UI
springdoc.swagger-ui.enabled=true

# Authorization Code configuration
auth-code.code-expiration-second=${AUTHORIZATION-CODE-EXPIRATION-SECOND}
# TTL redis cho Authorization Code
auth-code.time-to-live-minute-redis=${AUTHORIZATION-CODE-TTL-MINUTE-REDIS}

# JWT Configuration
jwt.secret=${JWT_SECRET}
# jwt.issuer=wifakey-oauth-service

# AES encryption
refresh-token.encryption.secret=${REFRESH_TOKEN_SECRET}

# Cookie Configuration
cookie.access-token-name=${COOKIE_ACCESS_TOKEN_NAME}
cookie.access-token-max-age=${COOKIE_ACCESS_TOKEN_MAX_AGE}
cookie.refresh-token-name=${COOKIE_REFRESH_TOKEN_NAME}
cookie.refresh-token-max-age=${COOKIE_REFRESH_TOKEN_MAX_AGE}

# JWT Configuration
jwt.issuer=wifakey-oauth-service
jwt.rsa.private-key-path=file:keys/private_key.pem
jwt.rsa.public-key-path=file:keys/public_key.pem
jwt.rsa.key-size=2048

# Session configuration - CHO LOCALHOST
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
# KHÔNG DÙNG same-site=none cho localhost
# server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.path=/
# KHÔNG SET domain cho localhost
# server.servlet.session.cookie.domain=localhost

server.servlet.session.tracking-modes=cookie

face.auth.python.url=http://localhost:8000
face.auth.timeout=30

server.forward-headers-strategy=framework


# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=flyingbookstore999@gmail.com
spring.mail.password=gwftsbkqyjkvviox
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.connectiontimeout=5000
spring.mail.properties.mail.timeout=5000
spring.mail.properties.mail.writetimeout=5000

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true

# App
app.base-url=${APP_BASE_URL:http://localhost:3000}
app.invitation.expiry-days=7

# Tên hiển thị trong trường "From" của email
app.mail.sender-name=Wifakey IdP
 
# Số lần retry tối đa trước khi đánh FAILED
app.mail.max-retry=3
 
# Số email xử lý mỗi batch
app.mail.batch-size=20
 
# Interval giữa các lần chạy scheduler (ms) — 30 giây
app.mail.process-interval-ms=30000