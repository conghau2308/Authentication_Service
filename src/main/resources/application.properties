spring.application.name=auth-service

spring.threads.virtual.enabled=true

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5436/authservice-db
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Connection pool settings
spring.datasource.hikari.pool-name=FaceAuthHikariPool

spring.jpa.hibernate.ddl-auto=none

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redis123

# Connection pool (Lettuce)
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=-1ms

# Timeout
spring.data.redis.timeout=60000

spring.config.import=optional:file:.env[.properties]

logging.level.com.Authentication=DEBUG

server.port=8080
server.url=${SERVER_URL:http://localhost:8080}
# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true

# Tùy chỉnh đường dẫn Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Cấu hình package để scan
springdoc.packages-to-scan=com.Authentication.AuthService.controller
springdoc.paths-to-match=/**

# Bật/tắt Swagger UI
springdoc.swagger-ui.enabled=true

# Authorization Code configuration
auth-code.code-expiration-second=${AUTHORIZATION-CODE-EXPIRATION-SECOND}
# TTL redis cho Authorization Code
auth-code.time-to-live-minute-redis=${AUTHORIZATION-CODE-TTL-MINUTE-REDIS}

# JWT Configuration
jwt.secret=${JWT_SECRET}
# jwt.issuer=wifakey-oauth-service

# AES encryption
refresh-token.encryption.secret=${REFRESH_TOKEN_SECRET}

# Cookie Configuration
cookie.access-token-name=${COOKIE_ACCESS_TOKEN_NAME}
cookie.access-token-max-age=${COOKIE_ACCESS_TOKEN_MAX_AGE}
cookie.refresh-token-name=${COOKIE_REFRESH_TOKEN_NAME}
cookie.refresh-token-max-age=${COOKIE_REFRESH_TOKEN_MAX_AGE}

# JWT Configuration
jwt.issuer=http://localhost:8080
jwt.rsa.private-key-path=file:keys/private_key.pem
jwt.rsa.public-key-path=file:keys/public_key.pem
jwt.rsa.key-size=2048

# Session configuration - CHO LOCALHOST
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
# KHÔNG DÙNG same-site=none cho localhost
# server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.path=/
# KHÔNG SET domain cho localhost
# server.servlet.session.cookie.domain=localhost

server.servlet.session.tracking-modes=cookie

face.auth.python.url=http://localhost:8000
face.auth.timeout=30

server.forward-headers-strategy=framework
