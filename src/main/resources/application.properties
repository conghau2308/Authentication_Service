spring.application.name=auth-service

spring.datasource.url=jdbc:mysql://localhost:3306/AuthServiceDB
spring.datasource.username=root
spring.datasource.password=auth123
# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Connection pool settings
spring.datasource.hikari.pool-name=FaceAuthHikariPool

spring.jpa.hibernate.ddl-auto=none

spring.config.import=optional:file:.env[.properties]

logging.level.com.Authentication=DEBUG

server.port=8080
server.url=${SERVER_URL:http://localhost:8080}
# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true

# JWT Configuration
jwt.secret=4fa3b190e8d42319b74e3d1ace09f85b1c9a4f02c3475debc7a92f38dc1d548e
jwt.access-token-expiration=900000
jwt.access-token-expiration-auth=900000
jwt.refresh-token-expiration=86400000
jwt.issuer=wifakey-oauth-service

jwt:
  # RSA Configuration
  issuer: http://localhost:8080
  
  # RSA Key Files (sẽ tự động tạo nếu chưa có)
  rsa:
    private-key-path: keys/private_key.pem
    public-key-path: keys/public_key.pem
    key-size: 2048

# Session configuration - CHO LOCALHOST
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
# KHÔNG DÙNG same-site=none cho localhost
# server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.path=/
# KHÔNG SET domain cho localhost
# server.servlet.session.cookie.domain=localhost

server.servlet.session.tracking-modes=cookie

face.auth.python.url=http://localhost:8000
face.auth.timeout=30

server.forward-headers-strategy=framework
